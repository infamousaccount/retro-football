<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Retro Bowl</title>
<style>
  html, body { margin: 0; height: 100%; background: #070c16; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    background: #2b7a3d;
  }
</style>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width;
  var H = canvas.height;

  // ---- field geometry, in world pixels (10px per yard) ----
  var FIELD_TOP = 46;
  var FIELD_BOTTOM = 252;
  var FIELD_H = FIELD_BOTTOM - FIELD_TOP;
  var GOAL_L = 0;
  var GOAL_R = 800;      // 80 yards from own goal line to theirs
  var EZ = 64;           // end zone depth
  var START_X = 250;     // own 25
  var FIRST_DOWN = 200;  // 20 yards to move the chains
  var GAME_SECONDS = 90;

  var C = {
    grassA: '#2b7a3d', grassB: '#33804a', line: '#eaf5ec',
    ezHome: '#1b2f52', ezAway: '#e8951a',
    home: '#2b59c3', homeTrim: '#f7f3e3',
    away: '#cf3a3a', awayTrim: '#1b1b1b',
    ball: '#8a4b1e', hud: '#0b1220', edge: '#ff9f1c',
    ink: '#f7f3e3', accent: '#ffd23f', dim: '#8fa3bf'
  };

  var state, player, defenders, scrimmage, firstDownAt, down, score, clock;
  var message, messageT, camX, downT, celebrateT;

  var keys = {};
  var pointer = { active: false, x: 0, y: 0 };

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function formatClock(s) { return Math.floor(s / 60) + ':' + pad(Math.floor(s % 60)); }

  // ---- setup ----
  function newGame() {
    score = 0;
    clock = GAME_SECONDS;
    message = '';
    messageT = 0;
    startDrive(START_X);
  }

  function startDrive(x) {
    scrimmage = x;
    firstDownAt = Math.min(x + FIRST_DOWN, GOAL_R);
    down = 1;
    placePlayer();
    spawnDefenders();
    state = 'ready';
  }

  function placePlayer() {
    player.x = scrimmage;
    player.y = FIELD_TOP + FIELD_H / 2;
    camX = clamp(player.x - 150, -EZ, GOAL_R + EZ - W);
  }

  function spawnDefenders() {
    defenders = [];
    var count = 5;
    var base = 56 + Math.min(score * 1.1, 34);
    for (var i = 0; i < count; i++) {
      defenders.push({
        x: scrimmage + 130 + i * 95 + Math.random() * 40,
        y: FIELD_TOP + 24 + Math.random() * (FIELD_H - 48),
        speed: base + Math.random() * 14 + i * 1.5
      });
    }
  }

  // ---- flow ----
  function flash(text) { message = text; messageT = 1.6; }

  function action() {
    if (state === 'gameover') { newGame(); return; }
    if (state === 'ready') { state = 'live'; }
  }

  function tackle() {
    var spot = Math.max(player.x, scrimmage);
    player.x = spot;
    state = 'down';
    downT = 0.85;

    if (spot >= firstDownAt) {
      scrimmage = spot;
      down = 1;
      firstDownAt = Math.min(spot + FIRST_DOWN, GOAL_R);
      flash('FIRST DOWN');
    } else {
      down += 1;
      if (down > 4) {
        down = 1;
        scrimmage = START_X;
        firstDownAt = START_X + FIRST_DOWN;
        flash('TURNOVER');
      } else {
        scrimmage = spot;
      }
    }
  }

  function touchdown() {
    score += 7;
    state = 'touchdown';
    celebrateT = 1.5;
    flash('TOUCHDOWN!');
  }

  // ---- movement ----
  function inputVector() {
    var dx = 0;
    var dy = 0;
    if (keys.arrowleft || keys.a) dx -= 1;
    if (keys.arrowright || keys.d) dx += 1;
    if (keys.arrowup || keys.w) dy -= 1;
    if (keys.arrowdown || keys.s) dy += 1;

    if (pointer.active) {
      var tx = pointer.x - player.x;
      var ty = pointer.y - player.y;
      var d = Math.hypot(tx, ty);
      if (d > 8) { dx = tx / d; dy = ty / d; }
    }

    var len = Math.hypot(dx, dy);
    if (len > 0) { dx /= len; dy /= len; }
    return { x: dx, y: dy };
  }

  function movePlayer(dt) {
    var v = inputVector();
    player.x += v.x * player.speed * dt;
    player.y += v.y * player.speed * dt;
    player.y = clamp(player.y, FIELD_TOP + 10, FIELD_BOTTOM - 10);
    player.x = clamp(player.x, scrimmage - 24, GOAL_R + EZ);
  }

  function moveDefenders(dt) {
    for (var i = 0; i < defenders.length; i++) {
      var d = defenders[i];
      var dx = player.x - d.x;
      var dy = player.y - d.y;
      var len = Math.hypot(dx, dy) || 1;
      d.x += (dx / len) * d.speed * dt;
      d.y += (dy / len) * d.speed * dt;
      d.y = clamp(d.y, FIELD_TOP + 10, FIELD_BOTTOM - 10);
    }
  }

  function checkTackle() {
    for (var i = 0; i < defenders.length; i++) {
      var d = defenders[i];
      if (Math.hypot(d.x - player.x, d.y - player.y) < 11) { tackle(); return; }
    }
  }

  // ---- loop ----
  function update(dt) {
    if (messageT > 0) messageT -= dt;

    if (state === 'gameover') return;

    if (state === 'touchdown') {
      celebrateT -= dt;
      if (celebrateT <= 0) startDrive(START_X);
      return;
    }

    if (state === 'down') {
      downT -= dt;
      if (downT <= 0) { placePlayer(); spawnDefenders(); state = 'ready'; }
      return;
    }

    clock -= dt;
    if (clock <= 0) { clock = 0; state = 'gameover'; return; }

    if (state === 'live') {
      movePlayer(dt);
      moveDefenders(dt);
      if (player.x >= GOAL_R) { touchdown(); return; }
      checkTackle();
    }

    var target = clamp(player.x - 150, -EZ, GOAL_R + EZ - W);
    camX += (target - camX) * Math.min(1, dt * 8);
  }

  // ---- drawing ----
  function drawField() {
    ctx.fillStyle = C.grassA;
    ctx.fillRect(-EZ, FIELD_TOP, GOAL_R + EZ * 2, FIELD_H);

    ctx.fillStyle = C.grassB;
    for (var x = -EZ; x < GOAL_R + EZ; x += 50) {
      if ((Math.floor(x / 50) % 2) === 0) ctx.fillRect(x, FIELD_TOP, 50, FIELD_H);
    }

    ctx.fillStyle = C.ezHome;
    ctx.fillRect(-EZ, FIELD_TOP, EZ, FIELD_H);
    ctx.fillStyle = C.ezAway;
    ctx.fillRect(GOAL_R, FIELD_TOP, EZ, FIELD_H);

    ctx.save();
    ctx.fillStyle = C.ink;
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.save();
    ctx.translate(-EZ / 2, FIELD_TOP + FIELD_H / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('RETRO', 0, 0);
    ctx.restore();
    ctx.save();
    ctx.translate(GOAL_R + EZ / 2, FIELD_TOP + FIELD_H / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('BOWL', 0, 0);
    ctx.restore();

    // yard lines and numbers
    ctx.fillStyle = C.line;
    ctx.font = 'bold 8px "Courier New", monospace';
    for (var yard = 10; yard <= 70; yard += 10) {
      var gx = GOAL_L + yard * 10;
      ctx.fillRect(gx, FIELD_TOP, 1, FIELD_H);
      var label = yard <= 40 ? String(yard) : String(80 - yard);
      ctx.fillText(label, gx, FIELD_TOP + 9);
      ctx.fillText(label, gx, FIELD_BOTTOM - 9);
    }
    ctx.restore();

    // sideline ticks
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.fillRect(-EZ, FIELD_TOP, GOAL_R + EZ * 2, 2);
    ctx.fillRect(-EZ, FIELD_BOTTOM - 2, GOAL_R + EZ * 2, 2);
  }

  function drawMarkers() {
    ctx.fillStyle = 'rgba(107,168,255,.85)';       // line of scrimmage
    ctx.fillRect(Math.round(scrimmage), FIELD_TOP, 1, FIELD_H);
    ctx.fillStyle = 'rgba(255,210,63,.9)';         // first down marker
    ctx.fillRect(Math.round(firstDownAt), FIELD_TOP, 2, FIELD_H);
  }

  function drawFigure(x, y, jersey, trim, withBall) {
    x = Math.round(x);
    y = Math.round(y);
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.fillRect(x - 5, y + 5, 10, 3);
    ctx.fillStyle = trim;
    ctx.fillRect(x - 4, y + 1, 3, 5);
    ctx.fillRect(x + 1, y + 1, 3, 5);
    ctx.fillStyle = jersey;
    ctx.fillRect(x - 5, y - 5, 10, 7);
    ctx.fillStyle = trim;
    ctx.fillRect(x - 4, y - 10, 8, 5);
    ctx.fillStyle = jersey;
    ctx.fillRect(x - 4, y - 10, 8, 2);
    if (withBall) {
      ctx.fillStyle = C.ball;
      ctx.fillRect(x + 4, y - 2, 4, 3);
    }
  }

  function drawPlayers() {
    for (var i = 0; i < defenders.length; i++) {
      drawFigure(defenders[i].x, defenders[i].y, C.away, C.awayTrim, false);
    }
    drawFigure(player.x, player.y, C.home, C.homeTrim, true);
  }

  function downLabel() {
    var ordinal = ['1ST', '2ND', '3RD', '4TH'][clamp(down, 1, 4) - 1];
    var togo = Math.max(1, Math.ceil((firstDownAt - scrimmage) / 10));
    return ordinal + ' & ' + togo;
  }

  function drawHud() {
    ctx.fillStyle = C.hud;
    ctx.fillRect(0, 0, W, 44);
    ctx.fillStyle = C.edge;
    ctx.fillRect(0, 42, W, 2);

    ctx.textBaseline = 'middle';
    ctx.font = 'bold 13px "Courier New", monospace';

    ctx.textAlign = 'left';
    ctx.fillStyle = C.ink;
    ctx.fillText('YOU ' + pad(score), 10, 15);

    ctx.textAlign = 'center';
    ctx.fillStyle = C.accent;
    ctx.fillText(downLabel(), W / 2, 15);

    ctx.textAlign = 'right';
    ctx.fillStyle = clock <= 15 ? '#ff6b6b' : C.ink;
    ctx.fillText(formatClock(clock), W - 10, 15);

    ctx.font = 'bold 9px "Courier New", monospace';
    ctx.fillStyle = C.dim;
    ctx.textAlign = 'left';
    ctx.fillText('RETRO BOWL', 10, 33);
    ctx.textAlign = 'right';
    ctx.fillText('ARROWS OR DRAG', W - 10, 33);
  }

  function centerText(text, y, color, size) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold ' + (size || 12) + 'px "Courier New", monospace';
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, y);
  }

  function drawOverlay() {
    if (state === 'ready') {
      centerText('TAP OR PRESS SPACE TO SNAP', FIELD_TOP + FIELD_H / 2 - 16, C.ink, 11);
      centerText('RUN RIGHT - DODGE THE DEFENSE', FIELD_TOP + FIELD_H / 2 + 4, C.accent, 9);
    }
    if (messageT > 0 && message) {
      centerText(message, FIELD_TOP + FIELD_H / 2 - 46, C.accent, 14);
    }
    if (pointer.active && state === 'live') {
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.fillRect(Math.round(pointer.x - camX) - 3, Math.round(pointer.y) - 3, 6, 6);
    }
    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(8,14,26,.82)';
      ctx.fillRect(0, 0, W, H);
      centerText('FINAL SCORE', H / 2 - 34, C.dim, 10);
      centerText('YOU ' + pad(score), H / 2 - 8, C.ink, 22);
      centerText('TAP OR PRESS SPACE TO PLAY AGAIN', H / 2 + 30, C.accent, 10);
    }
  }

  function draw() {
    ctx.fillStyle = C.hud;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(-Math.round(camX), 0);
    drawField();
    drawMarkers();
    drawPlayers();
    ctx.restore();

    drawHud();
    drawOverlay();
  }

  var last = 0;
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ---- input ----
  function keyName(e) { return String(e.key || '').toLowerCase(); }

  window.addEventListener('keydown', function (e) {
    var k = keyName(e);
    if (k === ' ' || k === 'spacebar' || k === 'enter') {
      e.preventDefault();
      action();
      return;
    }
    if (k === 'r') { newGame(); return; }
    keys[k] = true;
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) {
      e.preventDefault();
    }
  });

  window.addEventListener('keyup', function (e) {
    keys[keyName(e)] = false;
  });

  function toWorld(e) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * W + camX,
      y: ((e.clientY - rect.top) / rect.height) * H
    };
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var p = toWorld(e);
    pointer.x = p.x;
    pointer.y = p.y;
    pointer.active = true;
    action();
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!pointer.active) return;
    var p = toWorld(e);
    pointer.x = p.x;
    pointer.y = p.y;
  });

  function release() { pointer.active = false; }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerleave', release);

  window.addEventListener('blur', function () { keys = {}; release(); });

  // ---- start ----
  player = { x: START_X, y: FIELD_TOP + FIELD_H / 2, speed: 118 };
  newGame();

  // small read-only handle so the page embedding the game can drive/verify it
  window.retroBowlGame = {
    get state() { return state; },
    get score() { return score; },
    get down() { return down; },
    get clock() { return clock; },
    get playerX() { return player.x; },
    get scrimmage() { return scrimmage; },
    get firstDownAt() { return firstDownAt; },
    snap: action
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
